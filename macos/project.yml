name: Headroom
options:
  bundleIdPrefix: com.centaur-labs
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    # watchOS 10 is where WidgetKit complications and `.containerBackground`
    # landed; the watch app has no reason to reach further back than the
    # complications it exists to host.
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # MARKETING_VERSION / CURRENT_PROJECT_VERSION / DEVELOPMENT_TEAM live only
    # in Version.xcconfig, written by scripts/version-env.sh. Setting them here
    # would override the xcconfig and freeze builds at 1; hardcoding the team
    # would stop forks from signing as themselves ($HEADROOM_TEAM_ID or the
    # gitignored macos/Local.xcconfig — see README, "Signing as yourself").
    # Every PRODUCT_BUNDLE_IDENTIFIER below goes through
    # $(HEADROOM_BUNDLE_PREFIX) for the same reason: the default is set in
    # Version.xcconfig and Local.xcconfig can replace it. A literal id here
    # would sit above the xcconfig in Xcode's precedence and win.
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
targets:
  Headroom:
    type: application
    platform: macOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: Sources
      - path: ../Shared
      - path: Assets.xcassets
      # Bundled Python host → Contents/Resources/host/
      - path: host
        type: folder
        buildPhase: resources
      # The updater, run from inside the bundle → Contents/Resources/.
      # Bundled rather than reimplemented in Swift because an app cannot
      # replace itself while it is the thing running, and this script already
      # brackets the swap with the LaunchAgent bootout/bootstrap the embedded
      # host needs. See docs/updater.md.
      - path: ../scripts/update-app.sh
        buildPhase: resources
      # Release notes for Settings → About. Same file the release workflow
      # and App Store What's New already copy from — one source, shipped.
      - path: ../CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom.macos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Headroom
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Headroom.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --write-xcconfig'
    postCompileScripts:
      - name: Stamp Apple version
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --stamp-product'
    dependencies:
      - target: HeadroomWidgetMac
        embed: true
    scheme:
      testTargets:
        - HeadroomTests
  HeadroomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        # Without this the test bundle can't code sign, so `xcodebuild test`
        # fails before running anything.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom.macos.tests
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Headroom
  HeadroomMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: ../ios/HeadroomMobile
        excludes:
          - Info.plist
          - HeadroomMobile.entitlements
      - path: ../Shared
      - path: ../CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../ios/HeadroomMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: ../ios/HeadroomMobile/HeadroomMobile.entitlements
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --write-xcconfig'
    # Do not stamp the widget target alone — that made appex=37 while app=1.
    # Versions come from Version.xcconfig for both; parent can re-stamp the
    # whole .app tree if needed after compile.
    postCompileScripts:
      - name: Stamp Apple version
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/../scripts/version-env.sh" --stamp-product'
    dependencies:
      - target: HeadroomWidget
        embed: true
      # The watch app rides inside the phone app. It is the only route the
      # watch has to the Mac's numbers — see ios/HeadroomMobile/WatchBridge.swift.
      - target: HeadroomWatch
        embed: true
    scheme:
      testTargets:
        - HeadroomMobileTests
  HeadroomWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: ../widget/HeadroomWidget.swift
      - path: ../widget/HeadroomWidgetIntent.swift
      - path: ../Shared/WidgetIdentity.swift
      - path: ../Shared/WidgetSnapshot.swift
      - path: ../Shared/LossyDecode.swift
      - path: ../Shared/HeadroomRings.swift
      - path: ../Shared/HeadroomCopy.swift
      # Palette and chart geometry only — all three are deliberately free of
      # the model layer so the widget can tint rings and draw the combined
      # burndown without compiling HeadroomModels.swift.
      - path: ../Shared/HeadroomPalette.swift
      - path: ../Shared/BurndownChartMath.swift
      - path: ../Shared/BurndownChartCanvas.swift
      - path: ../Shared/WidgetSnapshotPresentation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../widget/ios/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../widget/ios/HeadroomWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
  # Same extension, same sources, second platform. The Mac writes the cache it
  # reads itself, so this one is current rather than a background-refresh
  # interval behind — see Shared/WidgetCacheWriter.swift.
  HeadroomWidgetMac:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: ../widget/HeadroomWidget.swift
      - path: ../widget/HeadroomWidgetIntent.swift
      - path: ../Shared/WidgetIdentity.swift
      - path: ../Shared/WidgetSnapshot.swift
      - path: ../Shared/LossyDecode.swift
      - path: ../Shared/HeadroomRings.swift
      - path: ../Shared/HeadroomCopy.swift
      - path: ../Shared/HeadroomPalette.swift
      - path: ../Shared/BurndownChartMath.swift
      - path: ../Shared/BurndownChartCanvas.swift
      - path: ../Shared/WidgetSnapshotPresentation.swift
    settings:
      base:
        PRODUCT_NAME: HeadroomWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom.macos.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../widget/macos/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../widget/macos/HeadroomWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
  # The watch app exists to host the complications and to be somewhere to land
  # when you tap one. It cannot reach the Mac — the phone forwards the widget
  # snapshot over WatchConnectivity and this writes it into the watch's own app
  # group, where the complication extension reads it.
  HeadroomWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: ../watch/HeadroomWatch
        excludes:
          - Info.plist
          - "**/*.entitlements"
      - path: ../watch/Shared
      # The wire, the palette, the chrome, the ring engine, and the chart
      # geometry — the same files the widgets compile, and deliberately free of
      # the model layer so neither has to.
      - path: ../Shared/WidgetSnapshot.swift
      - path: ../Shared/LossyDecode.swift
      - path: ../Shared/WidgetSnapshotPresentation.swift
      - path: ../Shared/HeadroomRings.swift
      - path: ../Shared/HeadroomCopy.swift
      - path: ../Shared/HeadroomPalette.swift
      - path: ../Shared/BurndownChartMath.swift
      - path: ../Shared/BurndownChartCanvas.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../watch/HeadroomWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ../watch/HeadroomWatch/HeadroomWatch.entitlements
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: HeadroomWatchComplication
        embed: true
    # Without this the target gets no scheme, so the watch app never appears in
    # Xcode's scheme picker and cannot be run on a paired Watch by hand. It
    # still builds — `xcodebuild -scheme HeadroomWatch` autocreates one — which
    # is why the gap only shows up in the UI.
    scheme: {}
  HeadroomWatchComplication:
    type: app-extension
    platform: watchOS
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    sources:
      - path: ../watch/HeadroomWatchComplication
        excludes:
          - Info.plist
          - "**/*.entitlements"
      # Everything under watch/Shared is written to compile in both — the
      # complication draws the same glyph and the same chart the watch app's
      # own screen does.
      - path: ../watch/Shared
      - path: ../Shared/WidgetSnapshot.swift
      - path: ../Shared/LossyDecode.swift
      - path: ../Shared/WidgetSnapshotPresentation.swift
      - path: ../Shared/HeadroomRings.swift
      - path: ../Shared/HeadroomCopy.swift
      - path: ../Shared/HeadroomPalette.swift
      - path: ../Shared/BurndownChartMath.swift
      - path: ../Shared/BurndownChartCanvas.swift
    settings:
      base:
        # Not `.complication` — Apple's portal refuses to register that exact
        # identifier ("not available") even though the parent `.watchkitapp`
        # registers fine. A short single-word suffix is what works on this
        # team (cf. com.septena.cloud.watchkitapp.next). Both complications
        # live in this one extension, so the word names neither of them.
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom.watchkitapp.faces
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../watch/HeadroomWatchComplication/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ../watch/HeadroomWatchComplication/HeadroomWatchComplication.entitlements
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
  HeadroomMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../ios/HeadroomMobileTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADROOM_BUNDLE_PREFIX).headroom.tests
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: HeadroomMobile
